# 로컬 kind 클러스터(`36`). 노드 셋 — 앱 파드 셋이 한 노드에 몰리지 않는 모양을 보려고 일꾼을 둘 둔다.
# 만들기: `bash scripts/k8s-up.sh`. 지우기: `bash scripts/k8s-down.sh`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ticket
nodes:
  - role: control-plane
    # 화면(`36a`)을 호스트 3000 에 연다 — `web` Service 의 NodePort. 이 설정을 바꾸면 클러스터를 다시 만들어야 든다.
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
  - role: worker
  - role: worker
