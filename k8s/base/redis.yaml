# Redis(`36`). compose `redis` 를 옮겼다. 날아가도 사고가 아닌 것만 둔다(대기열·세션·좌석 판) — 볼륨을 안 단다.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ticket
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
