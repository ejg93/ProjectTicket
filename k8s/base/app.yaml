# 앱(`36`). compose `app` + nginx 의 자리를 Deployment 셋과 Service 하나가 받는다 —
# nginx 의 `upstream` 이 하던 대수 나누기를 Service 엔드포인트가 한다(`35` 가 넘긴 것).
# 이미지는 `scripts/k8s-up.sh` 가 굽고 `kind load` 로 노드에 넣는다 — 레지스트리에서 안 받는다(`imagePullPolicy: Never`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: ticket
data:
  DB_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ticket
  POSTGRES_USER: ticket
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: kafka:9092
  # 데모 시드(`DemoSeeder`) — 부하 시험(`38`)이 그 회차를 쓴다.
  SPRING_PROFILES_ACTIVE: local
---
# **로컬 전용이다.** `stringData` 로 평문을 저장소에 둔다 — compose 기본값과 같은 값이고 kind 밖으로 안 나간다.
# 실제 배포면 이 Secret 은 저장소 밖에서 만든다(`security-baseline.md` 「비밀」).
apiVersion: v1
kind: Secret
metadata:
  name: app
  namespace: ticket
type: Opaque
stringData:
  POSTGRES_PASSWORD: ticket
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: ticket
spec:
  selector:
    app: app
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ticket
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # 앱의 graceful 종료 상한(`timeout-per-shutdown-phase: 20s`)보다 길어야 진행 중인 요청을 마치고 내려간다.
      terminationGracePeriodSeconds: 30
      # compose 의 `depends_on: condition: service_healthy` 자리. k8s 는 순서를 안 지켜서 앱이 DB 보다 먼저 뜨면
      # Flyway 가 「Connection refused」로 기동을 죽이고 재시작을 서너 번 돈다 — DB 가 받을 때까지 여기서 기다린다.
      initContainers:
        - name: wait-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U ticket; do sleep 2; done"]
      containers:
        - name: app
          image: ticket-app:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: app
            - secretRef:
                name: app
          ports:
            - containerPort: 8080
          # 준비됐나(db·redis)와 살아 있나를 가른다(35a). DB 가 끊긴 대는 엔드포인트에서 빠지되 재시작되지 않는다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          # 셋이 한꺼번에 뜨면 Flyway 락을 기다리는 대가 생긴다 — 기동 동안은 liveness 를 미룬다(최대 150초).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          # HPA(`38`)는 requests 대비 사용률로 잰다 — requests 가 없으면 HPA 가 `<unknown>` 이다.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
