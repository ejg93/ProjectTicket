# Source: ticket/templates/app.yaml
# 앱(`36`). compose `app` + nginx 의 자리를 Deployment 와 Service 하나가 받는다 —
# nginx 의 `upstream` 이 하던 대수 나누기를 Service 엔드포인트가 한다(`35` 가 넘긴 것).
# 이미지는 `scripts/k8s-up.sh` 가 굽고 `kind load` 로 노드에 넣는다 — 레지스트리에서 안 받는다(`imagePullPolicy: Never`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: ticket
  labels:
    app.kubernetes.io/part-of: ticket
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ticket-0.1.0
data:
  DB_HOST: "db"
  KAFKA_BOOTSTRAP: "kafka:9092"
  POSTGRES_DB: "ticket"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "ticket"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SPRING_PROFILES_ACTIVE: "local"

