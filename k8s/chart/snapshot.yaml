# Source: ticket/templates/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticket
  labels:
    app.kubernetes.io/part-of: ticket
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ticket-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5

---
# Source: ticket/templates/hpa.yaml
# 앱 대수를 CPU 로 고른다(`38`). 하한 3 은 `replicas` 의 자리다 — 롤링 중에도 셋 밑으로 안 내려간다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: ticket
  labels:
    app.kubernetes.io/part-of: ticket
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ticket-0.1.0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

