# Source: ticket/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ticket
  labels:
    app.kubernetes.io/part-of: ticket
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ticket-0.1.0
spec:
  # 한 대씩 새로 띄우고 준비되면 옛 대를 내린다 — 받는 대수가 줄지 않는다(`38`).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # 앱의 graceful 종료 상한(`timeout-per-shutdown-phase: 20s`)보다 길어야 진행 중인 요청을 마치고 내려간다.
      terminationGracePeriodSeconds: 30
      # compose 의 `depends_on: condition: service_healthy` 자리. k8s 는 순서를 안 지켜서 앱이 DB 보다 먼저 뜨면
      # Flyway 가 「Connection refused」로 기동을 죽이고 재시작을 서너 번 돈다 — DB 가 받을 때까지 여기서 기다린다.
      initContainers:
        - name: wait-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U ticket; do sleep 2; done"]
      containers:
        - name: app
          image: ticket-app:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: app
            - secretRef:
                name: app
          ports:
            - containerPort: 8080
          # 준비됐나(db·redis)와 살아 있나를 가른다(35a). DB 가 끊긴 대는 엔드포인트에서 빠지되 재시작되지 않는다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          # 셋이 한꺼번에 뜨면 Flyway 락을 기다리는 대가 생긴다 — 기동 동안은 liveness 를 미룬다(최대 150초).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 512Mi

