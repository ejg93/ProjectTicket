# Source: ticket/templates/postgres.yaml
# Postgres(`36`). compose `db` 를 옮겼다 — 같은 이미지, 같은 기동 인자(`pg_stat_statements`), 같은 init SQL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: ticket
  labels:
    app.kubernetes.io/part-of: ticket
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ticket-0.1.0
data:
  # `docker/postgres/init/01-stat.sql` 과 같다. 볼륨이 비었을 때 한 번만 돈다.
  01-stat.sql: |
    create extension if not exists pg_stat_statements;

