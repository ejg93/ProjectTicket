# Source: ticket/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: ticket
  labels:
    app.kubernetes.io/part-of: ticket
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ticket-0.1.0
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
          env:
            - name: POSTGRES_DB
              value: ticket
            - name: POSTGRES_USER
              value: ticket
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: Asia/Seoul
            # PVC 루트에 `lost+found` 가 있으면 initdb 가 「비어 있지 않다」로 선다 — 한 칸 아래를 쓴다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ticket", "-d", "ticket"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
