# **로컬 전용 값이다.** 비밀번호를 평문으로 둔다 — compose 기본값과 같고 kind 밖으로 안 나간다(`D9`).
app:
  replicas: 3
  image: ticket-app
  # `scripts/k8s-up.sh` 가 이 태그로 굽고 `kind load` 한다 — 레지스트리에서 안 받는다.
  tag: local
  # 앱의 graceful 종료 상한(20초)보다 길어야 한다(`K8sManifestTest`). preStop 대기가 이 안에서 먼저 쓴다.
  terminationGracePeriodSeconds: 30
  # 종료 신호 앞에 기다리는 초(`38`). 엔드포인트에서 빠진 것이 kube-proxy 에 퍼지기 전에 SIGTERM 이 오면
  # 이미 닫힌 대로 요청이 간다 — readiness·graceful 이 있어도 남는 틈이다. 0 이면 preStop 을 안 단다(측정 판 2).
  # 5 의 근거는 `doc/notes/rollout.md` 의 세 판이다.
  preStopSeconds: 5
  # HPA 는 requests 대비 사용률로 잰다(`38`).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 768Mi
  env:
    DB_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ticket
    POSTGRES_USER: ticket
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KAFKA_BOOTSTRAP: kafka:9092
    # 데모 시드(`DemoSeeder`) — 부하 시험(`38`)이 그 회차를 쓴다.
    SPRING_PROFILES_ACTIVE: local
  postgresPassword: ticket

# 화면(`36a`). `scripts/k8s-up.sh` 가 `BACKEND_ORIGIN=http://app:8080` 으로 굽는다 — `/api` 프록시 목적지가 빌드 때 굳는다.
web:
  replicas: 2
  image: ticket-web
  tag: local
  # 호스트 3300 ← kind `extraPortMappings` ← 이 NodePort(`k8s/kind.yaml`).
  nodePort: 30300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

postgres:
  image: postgres:17-alpine
  storage: 1Gi

redis:
  image: redis:7-alpine

kafka:
  image: apache/kafka:4.3.1

# CPU 사용률(requests 대비)로 대수를 고른다(`38`). 켜면 Deployment 의 `replicas` 를 안 쓴다 — 대수는 HPA 가 든다.
# metrics-server 가 있어야 돈다(`k8s/metrics-server.yaml`, `k8s-up.sh` 가 적용).
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  cpuPercent: 70
