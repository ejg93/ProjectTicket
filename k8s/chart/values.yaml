# **로컬 전용 값이다.** 비밀번호를 평문으로 둔다 — compose 기본값과 같고 kind 밖으로 안 나간다(`D9`).
app:
  replicas: 3
  image: ticket-app
  # `scripts/k8s-up.sh` 가 이 태그로 굽고 `kind load` 한다 — 레지스트리에서 안 받는다.
  tag: local
  # 앱의 graceful 종료 상한(20초)보다 길어야 한다(`K8sManifestTest`).
  terminationGracePeriodSeconds: 30
  # HPA 는 requests 대비 사용률로 잰다(`38`).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 768Mi
  env:
    DB_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ticket
    POSTGRES_USER: ticket
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KAFKA_BOOTSTRAP: kafka:9092
    # 데모 시드(`DemoSeeder`) — 부하 시험(`38`)이 그 회차를 쓴다.
    SPRING_PROFILES_ACTIVE: local
  postgresPassword: ticket

postgres:
  image: postgres:17-alpine
  storage: 1Gi

redis:
  image: redis:7-alpine

kafka:
  image: apache/kafka:4.3.1

# `38` 이 켠다.
hpa:
  enabled: false
