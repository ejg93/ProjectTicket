# 화면(`36a`). Next standalone 이미지. 서버 컴포넌트는 `BACKEND_ORIGIN` 으로 앱에 직접, 브라우저의 `/api` 는
# 빌드 때 굳은 rewrites 로 같은 곳에 간다 — 둘 다 앱 Service(`app:8080`)다(`D16` 「서버·클라이언트 경계」).
# 밖에서는 NodePort 30300 → kind 가 호스트 3300 으로 연다(`k8s/kind.yaml`).
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 3000
      nodePort: {{ .Values.web.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}:{{ .Values.web.tag }}
          imagePullPolicy: Never
          env:
            # 서버 컴포넌트가 실행 때 읽는다(`lib/api.ts`). rewrites 는 이 값이 아니라 빌드 인자로 굳은 값을 쓴다.
            - name: BACKEND_ORIGIN
              value: http://app:8080
          ports:
            - containerPort: 3000
          # 로그인 화면은 백엔드를 안 부른다 — 앱이 롤링 중이어도 화면 대가 엔드포인트에서 빠지지 않는다.
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
