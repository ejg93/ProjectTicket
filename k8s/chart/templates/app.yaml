# 앱(`36`). compose `app` + nginx 의 자리를 Deployment 와 Service 하나가 받는다 —
# nginx 의 `upstream` 이 하던 대수 나누기를 Service 엔드포인트가 한다(`35` 가 넘긴 것).
# 이미지는 `scripts/k8s-up.sh` 가 굽고 `kind load` 로 노드에 넣는다 — 레지스트리에서 안 받는다(`imagePullPolicy: Never`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.app.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
# **로컬 전용이다.** 평문을 `values.yaml` 에 둔다 — 실제 배포면 이 Secret 은 저장소 밖에서 만든다(`security-baseline.md` 「비밀」).
apiVersion: v1
kind: Secret
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.app.postgresPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket.labels" . | nindent 4 }}
spec:
  selector:
    app: app
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  # HPA 가 켜지면 대수는 그것이 든다 — 여기 박으면 `helm upgrade` 마다 HPA 가 늘린 대수를 되돌린다.
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  # 한 대씩 새로 띄우고 준비되면 옛 대를 내린다 — 받는 대수가 줄지 않는다(`38`).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # 앱의 graceful 종료 상한(`timeout-per-shutdown-phase: 20s`)보다 길어야 진행 중인 요청을 마치고 내려간다.
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      # compose 의 `depends_on: condition: service_healthy` 자리. k8s 는 순서를 안 지켜서 앱이 DB 보다 먼저 뜨면
      # Flyway 가 「Connection refused」로 기동을 죽이고 재시작을 서너 번 돈다 — DB 가 받을 때까지 여기서 기다린다.
      initContainers:
        - name: wait-db
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U {{ .Values.app.env.POSTGRES_USER }}; do sleep 2; done"]
      containers:
        - name: app
          image: {{ .Values.app.image }}:{{ .Values.app.tag }}
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: app
            - secretRef:
                name: app
          ports:
            - containerPort: 8080
          # 준비됐나(db·redis)와 살아 있나를 가른다(35a). DB 가 끊긴 대는 엔드포인트에서 빠지되 재시작되지 않는다.
          # 지연을 안 둔다 — 기동은 startupProbe 가 지킨다. 20초는 JVM 기동(18.7~34.3초, load-6)과 겹쳐 안 보였을 뿐, 기동이 그보다 짧아지면 바닥이 된다(53a).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          # 셋이 한꺼번에 뜨면 Flyway 락을 기다리는 대가 생긴다 — 기동 동안은 liveness 를 미룬다(최대 150초).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          {{- if gt (int .Values.app.preStopSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.app.preStopSeconds }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
