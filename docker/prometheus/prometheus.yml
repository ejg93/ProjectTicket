# 로컬 수집기(30). 앱은 호스트에서 돌 수도(gradlew bootRun) 컨테이너로 돌 수도(33) 있어서 둘 다 적는다 —
# 안 뜬 쪽은 `up == 0` 으로 보이고, 그것이 「지금 무엇이 도나」를 그대로 말해 준다.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ticket-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # 호스트에서 띄운 앱. Docker Desktop 에서 컨테이너가 호스트를 보는 이름이다.
      - targets: ["host.docker.internal:8080"]
        labels:
          instance_kind: host
    # compose 로 띄운 앱(33 이 `--scale app=3` 으로 늘린다). **`static_configs` 의 `app:8080` 은 긁을 때마다 셋 중 하나만 고른다** —
    # 카운터의 `increase()` 가 대를 오가며 뜻을 잃었다(1만 입장에 2,947, `35h`). DNS 의 A 레코드를 대상 하나씩으로 편다.
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8080
    # `dns_sd_configs` 는 `labels:` 를 못 받는다. DNS 로 찾은 대상(`__meta_dns_name` 이 있다)에만 꼬리표를 단다 — 호스트 대상은 위 `host` 그대로.
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: ".+"
        target_label: instance_kind
        replacement: compose
