# 인스턴스 셋 앞의 문(33). **sticky 를 안 쓴다** — 세션이 Redis 에 있어서(20a) 어느 대로 가도 같은 사람이다.
# sticky 를 쓰면 한 대가 죽을 때 그 대에 붙어 있던 사람만 로그아웃되고, 그것은 문제를 푼 게 아니라 숨긴 것이다(ADR 0004).
events {
    worker_connections 1024;
}

http {
    upstream ticket_app {
        # compose 의 서비스 이름이 대수만큼 A 레코드를 준다. 기본 분배는 라운드로빈이다.
        server app:8080;
    }

    server {
        listen 80;

        # 원래 누가 불렀나를 앱에 넘긴다. 앱은 `forward-headers-strategy: native` 로 이 헤더를 읽는다 —
        # 안 넘기면 감사 로그의 `acted_ip` 가 전부 프록시 IP 가 되고(`D9`), 로그인 실패 카운터(3a)도 한 IP 로 뭉친다.
        location / {
            proxy_pass http://ticket_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 대기열 폴링이 2초라 연결을 오래 잡지 않는다. 죽은 인스턴스를 빨리 건너뛰는 편이 낫다.
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
