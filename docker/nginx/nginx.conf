# 인스턴스 셋 앞의 문(33). **sticky 를 안 쓴다** — 세션이 Redis 에 있어서(20a) 어느 대로 가도 같은 사람이다.
# sticky 를 쓰면 한 대가 죽을 때 그 대에 붙어 있던 사람만 로그아웃되고, 그것은 문제를 푼 게 아니라 숨긴 것이다(ADR 0004).
events {
    worker_connections 1024;
}

http {
    # compose 망의 DNS(도커 내장). **이것이 없으면 이름을 기동 때 한 번만 푼다.**
    # 33 은 `upstream { server app:8080; }` 로 적었고, 그래서 `--scale app=3` 으로 셋을 띄워도
    # nginx 가 첫 A 레코드 하나만 쥔 채 **한 대에 전부 보냈다** — 35 의 부하에서 드러났다(`load-2.md`).
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        # 원래 누가 불렀나를 앱에 넘긴다. 앱은 `forward-headers-strategy: native` 로 이 헤더를 읽는다 —
        # 안 넘기면 감사 로그의 `acted_ip` 가 전부 프록시 IP 가 되고(`D9`), 로그인 실패 카운터(3a)도 한 IP 로 뭉친다.
        location / {
            # **변수로 적어야 매 요청에 다시 푼다.** 상수로 적으면 위 `resolver` 를 안 쓰고 기동 때 푼 값을 계속 쓴다.
            # 그 대가로 `upstream` 블록을 못 쓴다 — keepalive 와 죽은 대 건너뛰기가 없어진다.
            # 지금 저장소에서는 그 둘보다 **대수가 실제로 늘어나는 것**이 먼저다(`D13` 처리량 목표가 그 위에 선다).
            set $app_host app;
            proxy_pass http://$app_host:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 대기열 폴링이 2초라 연결을 오래 잡지 않는다. 죽은 인스턴스를 빨리 건너뛰는 편이 낫다.
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
