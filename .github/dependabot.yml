# 의존성 갱신을 주 1회 연다(청크 `2f`).
#
# **매일이 아닌 이유**: 매일이면 PR 이 쌓이고, 쌓인 PR 은 안 읽는다.
# 이 저장소는 활동일이 33일 중 24일이고 4~5일씩 비는 구간이 있다.
#
# **갱신 자체는 강제 지점이 아니다** — 여는 것뿐이고, 막는 것은 `ci.yml` 이다.
# 초록이 아니면 머지가 안 된다.
#
# **머지는 `dependabot-automerge.yml` 이 한다**(`2f-3`). minor·patch 는 초록이 되면
# 사람 없이 들어가고 메이저만 사람이 본다. **막는 것은 여전히 CI 다** — 자동 머지는
# 예약이라 필수 검사가 빨가면 그냥 안 일어난다.
version: 2

updates:
  # Gradle 을 먼저 적는다. Boot·Testcontainers 가 여기 있고, 이 둘이 올라갈 때
  # `stack.md` 의 항목이 실제로 흔들린다(Boot 4 스타터 이름, Testcontainers BOM).
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # 메이저는 따로 온다. 마이너와 한 PR 에 묶이면 「올려도 되나」의 답이 갈리는데
    # PR 은 하나라 **한쪽 판단으로 둘 다 들어간다.**
    groups:
      backend-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # **막아 둔 것이 없다.** Testcontainers 메이저를 막고 있었는데 `2f-2` 가 이관하면서
    # 풀었다 — `ignore` 는 상류가 못 받는 동안만 두고, 조건이 풀리면 지우는 것이 규칙이다.
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # 둘 다 **린트 쪽 상류가 아직 안 받는다.** 우리가 고쳐서 뚫을 수 있는 것이 아니라
    # 기다리는 것뿐이라, 매주 여는 대신 막아 두고 아래 조건으로 다시 연다.
    ignore:
      # `typescript-eslint does not support TS 7.0.` 으로 `npm run lint` 가 죽는다(PR #13).
      # typescript-eslint 가 TS 7 을 지원하면 이 줄을 지운다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # `eslint-plugin-jsx-a11y` 의 peer 가 eslint 10 을 안 받아서 `npm ci` 가 ERESOLVE 로
      # 죽는다(PR #14). **접근성 규칙이 그 플러그인에 있다**(`D20`) — 빼고 올리는 선택지가
      # 없다. 플러그인이 eslint 10 을 받으면 이 줄을 지운다.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # 워크플로가 부르는 액션도 의존성이다. `checkout@v4`·`setup-java@v4` 가 그대로
  # 굳으면 러너 쪽 변화에 먼저 깨지는 것이 CI 다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # **제한이 생태계별이라 셋이면 상한이 3배다.** 여기에 안 걸어서 첫 회차가
    # 열한 개로 왔다(액션 다섯·npm 넷·gradle 둘). 쌓인 PR 은 안 읽는다.
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
