services:
  db:
    image: postgres:17-alpine
    container_name: ticket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # pg_stat_statements 를 기동 인자로 적재한다. create extension 만으로는 안 된다 —
    # 좌석 선점 쿼리의 실행 계획·호출 수를 부하 청크(31)에서 읽는다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - db-data:/var/lib/postgresql/data
      # 볼륨이 비었을 때만 돈다.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket} -d ${POSTGRES_DB:-ticket}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 대기열 ZSET·활성 토큰·좌석 현황 캐시. 날아가도 사고가 아닌 것만 둔다 —
  # 좌석 상태·멱등키는 Postgres 다(domain-model.md).
  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 앱(33). **`container_name` 이 없다** — 이름을 박으면 `--scale app=3` 이 「이름이 이미 있다」로 죽는다.
  # 포트도 안 연다: 밖에서 들어오는 문은 nginx 하나다.
  app:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ticket}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 부하 시험(31)은 데모 데이터가 필요하다: `SPRING_PROFILES_ACTIVE=local docker compose up -d`.
      # 비워 두면 시드가 안 돈다 — 기본은 데이터가 없는 쪽이다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 인스턴스 앞의 문(33). sticky 없이 라운드로빈이다 — 세션이 Redis 라 어느 대로 가도 같은 사람이다.
  nginx:
    image: nginx:1.27-alpine
    container_name: ticket-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${GATEWAY_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # 지표 수집(30). 앱이 호스트든 컨테이너든 둘 다 긁는다 — 안 뜬 쪽은 `up == 0` 으로 보인다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ticket-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # 대시보드(30). 데이터 소스와 대시보드를 **파일로 심는다** — 손으로 클릭하면 컨테이너를 지울 때 같이 사라진다.
  grafana:
    image: grafana/grafana:11.5.0
    container_name: ticket-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # 로컬 전용이라 익명 열람을 켠다. 밖에 낼 것이면 이 줄부터 지운다(`D9`).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  db-data:
  redis-data:
  prometheus-data:
  grafana-data:
