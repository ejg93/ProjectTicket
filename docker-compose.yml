services:
  db:
    image: postgres:17-alpine
    container_name: ticket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # pg_stat_statements 를 기동 인자로 적재한다. create extension 만으로는 안 된다 —
    # 좌석 선점 쿼리의 실행 계획·호출 수를 부하 청크(31)에서 읽는다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - db-data:/var/lib/postgresql/data
      # 볼륨이 비었을 때만 돈다.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket} -d ${POSTGRES_DB:-ticket}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 대기열 ZSET·활성 토큰·좌석 현황 캐시. 날아가도 사고가 아닌 것만 둔다 —
  # 좌석 상태·멱등키는 Postgres 다(domain-model.md).
  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  redis-data:
