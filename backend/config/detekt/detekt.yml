# detekt 설정(47). 기본 규칙 위에 **우리가 다르게 정한 것만** 적는다(`buildUponDefaultConfig`).
#
# 문턱은 「새 검출 0건」이다(`D18`). 기준선 파일은 안 만든다 — 눌러 둔 목록은 아무도 다시 안 본다.
# 규칙을 끄거나 문턱을 올릴 때는 **근거를 여기 같이 적는다.** 근거 없이 끈 규칙은 다음 사람이 되돌릴 수가 없다.
#
# `allRules = true`(`G14`) — 기본 꺼진 규칙까지 켠다. 여기의 `active: false` 가 그것을 이긴다(2026-10-21 실측).
# 「`Gxx` 가 켠다」·「`Gxx` 가 지운다」 표시는 번들 11 이 아직 안 고친 몫이다 — 번들이 끝나면 0줄이어야 한다.

config:
  validation: true

style:
  MaxLineLength:
    # 기본 120 은 이 저장소에서 **코드가 아니라 주석을 자른다** — 한 줄에 「무엇을·왜」를 담는 문체(`CLAUDE.md` 「글 작성 규칙」)다.
    # detekt 가 120 으로 잡은 것이 222건이었다(첫 측정 262건 중). 파일을 그냥 세면 120 초과가 1,200줄 남짓인데
    # 그 차이는 **원시 문자열(SQL)을 이 규칙이 빼기 때문**이다 — 세는 기준이 다르다.
    # 200 을 넘는 줄은 13줄뿐이라 그것만 손으로 접는다.
    maxLineLength: 200
  ReturnCount:
    # 가드 절을 쓴다 — 못 하는 경우를 먼저 돌려보내고 본문을 평평하게 둔다(`coding-rules.md`).
    # 기본 2 는 그 문체를 금지하는 값이다.
    max: 6
  ThrowsCount:
    # 입력 검증이 여러 이유로 거절한다 — **이유마다 다른 `type`** 을 주는 것이 `D5` 의 계약이고,
    # 선점 하나가 일곱 가지로 거절된다(남의 좌석·닫힌 회차·상한 초과·중복 선점…). 뭉치면 화면이 무엇을 말할지 못 정한다.
    max: 8
  VarCouldBeVal:
    # 테스트 바탕의 `@Autowired lateinit var` 는 필드 주입이라 `val` 이 될 수 없다(`G8`).
    ignoreLateinitVar: true
  UnusedParameter:
    # 프레임워크가 서명을 정하는 자리가 있다 — `@ExceptionHandler` 는 예외를 받아야 하고 안 쓰는 경우가 있다.
    ignoreAnnotated: ["ExceptionHandler"]
  MagicNumber:
    # 테스트의 숫자는 **그 자체가 설명**이다(154_000원·4석·30일). 상수로 빼면 무엇을 재는지가 한 겹 멀어진다.
    excludes: ["**/test/**"]
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreAnnotation: true
  TrimMultilineRawString:
    # `"""…""".trimIndent()` 는 `SqlTextTest` 의 「`sql(` 인자는 리터럴 하나」(`G10`)를 깬다 — SQL 공백은 DB 가 무시해 얻는 것이 없다
    active: false
  # ── G15 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  BracesOnIfStatements:  # G15 가 켠다
    active: false
  BracesOnWhenStatements:  # G15 가 켠다
    active: false
  ClassOrdering:  # G15 가 켠다
    active: false
  UnnecessaryLet:  # G15 가 켠다
    active: false
  UseIfInsteadOfWhen:  # G15 가 켠다
    active: false
  UnnecessaryParentheses:  # G15 가 켠다
    active: false
  UnnecessaryFullyQualifiedName:  # G15 가 켠다
    active: false
  MaxChainedCallsOnSameLine:  # G15 가 켠다
    active: false
  MultilineLambdaItParameter:  # G15 가 켠다
    active: false
  StringShouldBeRawString:  # G15 가 켠다
    active: false
  # ── G16 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  MultilineRawStringIndentation:  # G16 가 켠다
    active: false
  # ── G18 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  CascadingCallWrapping:  # G18 가 켠다
    active: false

exceptions:
  TooGenericExceptionCaught:
    # **경계에서 `RuntimeException` 을 잡는 것이 우리 규약이다** — 스케줄러·릴레이·필터가 한 건의 실패로 뒤를 막지 않게 한다
    # (`coding-rules.md` 「예외」, `D11`). 규약과 싸우는 규칙은 끈다. 잡은 자리마다 **왜 잡는지는 주석이 있다.**
    active: false
  SwallowedException:
    # 우리가 삼키는 것은 전부 **다른 말로 바꾸려고** 잡는다 — 중복 키를 409·400 으로, 인증 실패를 같은 문구로(`D9`),
    # 없는 행을 null 로. 원인을 그대로 올리면 그 자리에서 계약이 깨진다. 앞 넷은 detekt 기본값이다.
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedURLException
      - NumberFormatException
      - ParseException
      - DuplicateKeyException
      - EmptyResultDataAccessException
      - AuthenticationException
      - RuntimeException
      # 우리 계약으로 바꾸려고 잡는 둘 — 잠금 경합은 409 `idempotency-in-progress` 로, PG 무응답은 상태 조회로(`D4`).
      - CannotAcquireLockException
      - TimedOut
      # 판매 창 제약 위반을 400 `validation-failed` 로 바꾸려고 잡는다(`45d-a`). 다른 제약은 그대로 다시 던진다.
      - DataIntegrityViolationException

complexity:
  LongMethod:
    # SQL 문자열이 줄 수를 먹는다. 우리 서비스는 한 트랜잭션을 한 함수에 담고 그 안에 SQL 이 통째로 들어간다 —
    # 60 줄 기준은 SQL 을 쪼개게 만들고, 쪼갠 SQL 은 읽기가 더 어렵다.
    allowedLines: 120
  TooManyFunctions:
    # 표 하나를 만지는 서비스가 그 표의 일을 다 든다(`NotificationStore`). 억지로 가르면 트랜잭션 경계가 흩어진다.
    allowedFunctionsPerClass: 20
    allowedFunctionsPerFile: 20
  # ── G15 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  NestedScopeFunctions:  # G15 가 켠다
    active: false
  CognitiveComplexMethod:  # G15 가 켠다
    active: false
  LabeledExpression:  # G15 가 켠다
    active: false
  ReplaceSafeCallChainWithRun:  # G15 가 켠다
    active: false
  StringLiteralDuplication:  # G15 가 켠다
    active: false
  # ── G17 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  NamedArguments:  # G17 가 켠다
    active: false

naming:
  FunctionParameterNaming:
    # 테스트가 한글 이름을 쓰는 자리가 있다 — 읽는 사람이 한국어 화자다(`CLAUDE.md`).
    excludes: ["**/test/**"]
  BooleanPropertyNaming:
    # `naming-rules.md` 「불리언의 `is_` 는 Kotlin 에서 뗀다」와 정반대다. `RefundQuote.cancellable` 은 응답 계약이다(`api-guidelines.md`)
    active: false
  FunctionNameMinLength:
    # `of`·`on`·`me` 같은 두 글자 관용 이름을 쓴다(팩토리·리스너·`/api/me`). 한 글자만 막는다
    minimumFunctionNameLength: 2
  FunctionNameMaxLength:
    # 시험 이름은 무엇을 증명하는지 적은 문장이다(snake_case, `coding-rules.md` 「테스트」)
    excludes: ["**/test/**"]

potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    # `coding-rules.md` 「`when` 에 `else` 를 안 둔다」를 문서에서 여기로 내렸다(`G7a`). 열거·sealed·Boolean 주어만 본다 —
    # 주어 없는 `when {}` 와 문자열 주어의 `else` 는 「나머지 전부」라는 뜻이라 안 걸린다. 타입 해석 규칙이라 `detektMain`·`detektTest` 에서만 돈다.
    active: true
  # ── G15 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  ImplicitUnitReturnType:  # G15 가 켠다
    active: false
  # ── G17 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  UnnamedParameterUse:  # G17 가 켠다
    active: false

performance:
  SpreadOperator:
    # 펼침이 나는 자리가 넷이고 전부 Java·Spring 의 vararg 다(`runApplication(*args)`·`requestMatchers(*…)`·`redis.execute(…, *args)`) —
    # 다른 호출 꼴이 없고 배열이 10개를 안 넘어 복사 값이 없다(`G8`).
    active: false
  # ── G15 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  CouldBeSequence:  # G15 가 켠다
    active: false

comments:
  # 셋은 공개 요소마다 KDoc 을 강제한다 — 규약은 「주석은 왜만, 코드가 답하는 것은 안 적는다」(`coding-rules.md` 「주석」)
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  # 둘은 private 의 KDoc 을 막는다 — private 에도 왜를 KDoc 으로 적는다(IDE 가 보여 준다)
  DocumentationOverPrivateFunction:
    active: false
  DocumentationOverPrivateProperty:
    active: false
  EndOfSentenceFormat:
    # 주석은 한국어 평서형이고 마침표로 안 끝낸다(`CLAUDE.md` 「글 작성 규칙」)
    active: false
  # ── G15 가 켠다 — 고치기 전까지 끈다(`G14` 가 `allRules` 를 켤 때 남은 몫)
  OutdatedDocumentation:  # G15 가 켠다
    active: false
