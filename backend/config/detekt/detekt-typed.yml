# 타입 해석 detekt(`detektMain`)의 설정(`G7a`). **여기 적은 규칙만 돈다** — 기본 규칙 위에 얹지 않는다.
#
# detekt 2.0 은 타입을 알아야 하는 규칙을 `detekt` 태스크에서 안 돌린다. `detekt.yml` 에 켜 두어도 `check` 에서
# 조용히 안 돌아서 켠 것처럼만 보인다(`G7a` 실측 — `detekt` 는 파일 180 개를 읽고 0건, `detektMain` 은 main 24건).
# 기본 규칙 전부를 타입 해석으로 돌리면 그 24건이 한꺼번에 빌드를 세운다 — 그 처분은 `G8`.

config:
  validation: true

potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    # `coding-rules.md` 「`when` 에 `else` 를 안 둔다」를 문서에서 여기로 내렸다. 열거·sealed·Boolean 주어만 본다 —
    # 주어 없는 `when {}` 와 문자열 주어의 `else`(지금 다섯)는 「나머지 전부」라는 뜻이라 안 걸린다.
    active: true
